# Jenkins behind Traefik (HTTPS domain, no public host port for UI)
# Prerequisites: Traefik running, external Docker network (proxy), DNS for JENKINS_DOMAIN.
# Traefik in this workspace uses ACME resolver name: le
#
# Usage:
#   cp .env.example .env && edit JENKINS_DOMAIN, CERTSRESOLVER=le, DOCKER_PROXY_NETWORK=proxy
#   docker network create proxy || true
#   docker compose -f docker-compose.traefik.yml config
#   docker compose -f docker-compose.traefik.yml up -d

name: jenkins-traefik

services:
  jenkins:
    image: ${JENKINS_IMAGE:-jenkins/jenkins:lts-jdk21}
    container_name: ${JENKINS_CONTAINER_NAME:-jenkins}
    user: "${JENKINS_UID:-1000}:${JENKINS_GID:-1000}"
    restart: unless-stopped
    environment:
      TZ: ${JENKINS_TZ:-UTC}
      # Set Jenkins URL after login to https://${JENKINS_DOMAIN}/ to avoid proxy warnings.
      JENKINS_OPTS: "--prefix=/"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Trusted CI only.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - jenkins_net
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${DOCKER_PROXY_NETWORK:-proxy}"
      - "traefik.http.routers.jenkins.rule=Host(`${JENKINS_DOMAIN:-jenkins.devops-odoo.com}`)"
      - "traefik.http.routers.jenkins.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.jenkins.tls=true"
      - "traefik.http.routers.jenkins.tls.certresolver=${CERTSRESOLVER:-le}"
      - "traefik.http.routers.jenkins.service=jenkins"
      - "traefik.http.services.jenkins.loadbalancer.server.port=8080"
      # Optional: HTTP->HTTPS redirect if not global in Traefik (middleware name must exist):
      # - "traefik.http.routers.jenkins-http.rule=Host(`${JENKINS_DOMAIN:-jenkins.devops-odoo.com}`)"
      # - "traefik.http.routers.jenkins-http.entrypoints=web"
      # - "traefik.http.routers.jenkins-http.middlewares=redirect-to-https@file"

networks:
  jenkins_net:
    name: jenkins_net
    driver: bridge
  proxy:
    external: true
    name: ${DOCKER_PROXY_NETWORK:-proxy}

volumes:
  jenkins_home:
    name: jenkins_home

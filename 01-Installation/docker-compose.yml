# Jenkins Installation — Phase 1 only (standalone). No Traefik/GitHub/Odoo/Ansible/Docker-pipeline integrations.
# Test on Ubuntu:
#   cd InstallingJenkins/01-Installation
#   cp .env.example .env && chmod 600 .env
#   docker compose config
#   docker compose up -d
#   docker exec jenkins cat /var/jenkins_home/secrets/initialAdminPassword

services:
  jenkins:
    image: ${JENKINS_IMAGE:-jenkins/jenkins:lts-jdk21}
    container_name: ${JENKINS_CONTAINER_NAME:-jenkins}
    user: "${JENKINS_UID:-1000}:${JENKINS_GID:-1000}"
    restart: unless-stopped
    ports:
      - "${JENKINS_HTTP_PORT:-8080}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"   # restrict with firewall; do not expose publicly without review
    environment:
      TZ: ${JENKINS_TZ:-UTC}
    volumes:
      - jenkins_home:/var/jenkins_home
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

volumes:
  jenkins_home:
    name: jenkins_home
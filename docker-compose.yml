# Jenkins Docker Deployment (standalone HTTP access)
# For production/domain access, prefer docker-compose.traefik.yml after Traefik is installed.
#
# Usage:
#   cp .env.example .env && chmod 600 .env
#   docker compose up -d
#   docker compose logs -f jenkins
#   docker exec jenkins cat /var/jenkins_home/secrets/initialAdminPassword

services:
  jenkins:
    image: ${JENKINS_IMAGE:-jenkins/jenkins:lts-jdk21}
    container_name: ${JENKINS_CONTAINER_NAME:-jenkins}
    user: "${JENKINS_UID:-1000}:${JENKINS_GID:-1000}"
    restart: unless-stopped
    ports:
      - "${JENKINS_HTTP_PORT:-8080}:8080"   # UI (standalone/testing)
      - "${JENKINS_AGENT_PORT:-50000}:50000" # inbound agents (restrict in production)
    environment:
      TZ: ${JENKINS_TZ:-UTC}
      # Disable setup wizard only when you provide secure init automation; default keeps wizard.
      # JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Allows Jenkins jobs to run Docker commands (trusted CI only).
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - jenkins_net

networks:
  jenkins_net:
    name: jenkins_net
    driver: bridge

volumes:
  jenkins_home:
    name: jenkins_home
